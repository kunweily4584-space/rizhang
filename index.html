<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日帳">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>日帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Sofia+Sans+Condensed:ital,wght@0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
/* VOICE: 安靜、俐落的日常工具，數字最大，其他都退後
   IDEA: 一本分成三色書籤的帳簿——個人／驗屋代墊／農場，各自分開不混帳
   PICTURE: 首頁大數字＋三本帳色條；分析頁甜甜圈與月趨勢
   COLOUR and TYPE: 深炭底（日）／白底；書籤色 藍=個人、珊瑚=驗屋、綠=農場；Noto Sans TC、數字等寬
   LAYOUT: 單欄手機版、底部導覽＋中央記帳鍵、底部抽屜表單 */
:root{color-scheme:light dark;
--bg:light-dark(#f3f4f6,#121418);--card:light-dark(#fff,#1c1f26);--card2:light-dark(#eef0f3,#252932);
--ink:light-dark(#15171c,#eef0f4);--mute:light-dark(#646b78,#9aa1ae);--line:light-dark(#e3e6eb,#2c303a);
--p:#3d7bff;--v:#9b6bff;--i:#ff7a59;--f:#2fb67a;--red:light-dark(#d93c3c,#ff6b6b);--grn:light-dark(#1f9d5c,#4fd08e);--warn:light-dark(#b86e00,#ffb547)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--bg)}
header h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.02em}
#sync{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;margin-inline-start:auto}
#sync i{width:8px;height:8px;border-radius:50%;background:var(--mute)}#sync.on i{background:var(--grn)}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.ib svg{width:22px;height:22px}
main{max-width:560px;margin:0 auto;padding:4px 16px calc(84px + env(safe-area-inset-bottom))}
.q{display:flex;flex-direction:column;gap:8px}
.qtop{display:flex;align-items:center;gap:10px;min-height:40px}
.tag{border:1.5px solid var(--c);color:var(--c);padding:2px 9px;border-radius:7px;font-weight:700;font-size:15px;white-space:nowrap}
.qdate{min-height:40px;border:0;background:transparent;font-size:18px;font-variant-numeric:tabular-nums;width:9em;padding:0}
.qtoday{margin-inline-start:auto;text-align:end;font-size:13px;color:var(--mute);line-height:1.2}.qtoday b{display:block;font-size:17px;color:var(--ink)}.qtoday>span{display:block;white-space:nowrap}
.qamt{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--c);padding:0 2px 2px}
.qamt span{font-size:24px;color:var(--mute)}.qamt b{font-size:clamp(46px,14vw,64px);font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.qamt b.z{color:var(--line)}.qamt .kd{margin-inline-start:auto;min-height:36px;padding:0 12px;border-radius:99px;background:var(--card2);font-size:14px;align-self:center;flex:none}
.qamt .kd.in{background:var(--grn);color:#fff}
.bseg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bseg button{min-height:44px;font-size:15px;color:var(--mute)}.bseg button.on{background:var(--c);color:#fff;font-weight:700}
.sub2{display:flex;gap:6px}.sub2 button{flex:1;min-height:36px;border-radius:10px;background:var(--card);font-size:14px;border:1.5px solid transparent}
.sub2 button.on{border-color:var(--c);color:var(--c);font-weight:700}
.qnote{min-height:42px;border:0;border-bottom:1px solid var(--line);background:transparent;font-size:16px;padding:0 4px}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.keys button{height:clamp(46px,6.6vh,58px);background:var(--card);border-radius:12px;font-size:26px;font-variant-numeric:tabular-nums}
.keys button:active,.tiles button:active{transform:scale(.96)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tiles button{height:clamp(56px,8vh,70px);background:var(--card2);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-bottom:3px solid color-mix(in srgb,var(--c) 55%,transparent)}
.tiles b{font-size:24px;font-weight:900;line-height:1.15}.tiles small{font-size:12px;color:var(--mute);white-space:nowrap}
.due{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:0 12px;border-radius:10px;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);font-size:14px;text-align:start}
.due.over{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}.due b{margin-inline-start:auto;flex:none}
.qhint{text-align:center;font-size:13px;color:var(--mute)}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hero{padding:18px 4px 8px}
.lbl{font-size:14px;color:var(--mute)}
.big{font-size:clamp(40px,12vw,56px);font-weight:900;line-height:1.05;margin:4px 0}
.sub{font-size:14px;color:var(--mute)}.up{color:var(--red)}.dn{color:var(--grn)}
.books{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:14px 0}.bk b{font-size:15px!important}
.bk{background:var(--card);border-radius:14px;padding:10px 12px;border-top:4px solid var(--c)}
.bk span{display:block;font-size:13px;color:var(--mute)}.bk b{font-size:17px}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tile{background:var(--card);border-radius:16px;padding:14px;text-align:start;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:22px;font-weight:900}.tile small{font-size:13px;color:var(--mute)}
h3{font-size:15px;margin:22px 4px 8px;color:var(--mute);font-weight:500;display:flex;justify-content:space-between;align-items:center}
h3 button{color:var(--p);font-size:14px;min-height:36px}
.card{background:var(--card);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:start}
.row:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.grow{flex:1;min-width:0}.grow b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow small{display:block;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:700}.amt.in{color:var(--grn)}
.chip{display:inline-block;font-size:12px;padding:1px 7px;border-radius:99px;background:var(--card2);color:var(--mute);margin-inline-start:4px;vertical-align:1px}
.chip.pend{background:color-mix(in srgb,var(--i) 18%,transparent);color:var(--i)}
.chip.clm{background:color-mix(in srgb,var(--p) 18%,transparent);color:var(--p)}
.chip.ok{background:color-mix(in srgb,var(--f) 18%,transparent);color:var(--grn)}
.chip.over{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.chip.soon{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.sbtn{min-height:36px;padding:0 12px;border-radius:10px;background:var(--card2);font-size:14px;font-weight:500;flex:none}
.sbtn.pri{background:var(--p);color:#fff}
.empty{padding:22px 16px;text-align:center;color:var(--mute);font-size:14px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:8px 0 12px}
.mnav b{font-size:18px}.mnav button{width:44px;height:44px;border-radius:12px;background:var(--card);font-size:20px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button{min-height:38px;padding:0 14px;border-radius:99px;background:var(--card);font-size:14px;border:1.5px solid transparent}
.seg button.on{border-color:var(--c,var(--ink));color:var(--c,var(--ink));font-weight:700}
.search{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;margin-bottom:12px}
.dayh{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);padding:8px 14px;background:var(--card2)}
.party{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pt{background:var(--card);border-radius:16px;padding:12px 14px;text-align:start;border:2px solid transparent}
.pt.on{border-color:var(--c)}.pt span{font-size:14px;color:var(--mute)}.pt b{display:block;font-size:22px;font-weight:900}.pt small{font-size:12px;color:var(--mute)}
.bar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.ck{width:22px;height:22px;accent-color:var(--p);flex:none}
.donut{position:relative;width:min(220px,62vw);aspect-ratio:1;margin:8px auto 14px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut b{font-size:24px;font-weight:900}.donut small{font-size:13px;color:var(--mute)}
.leg{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:12px 14px;font-size:15px}
.leg .pc{color:var(--mute);font-size:13px;text-align:end;width:3.2em}
.leg .tr{grid-column:2/5;height:5px;border-radius:3px;background:var(--card2);margin-bottom:6px}
.leg .tr i{display:block;height:100%;border-radius:3px}
.trend{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:170px;padding:14px 14px 8px}
.trend div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:12px;color:var(--mute)}
.trend p{flex:1;width:100%;margin:0;position:relative;display:flex;justify-content:center;align-items:flex-end;gap:3px}
.trend i{display:block;width:70%;max-width:36px;border-radius:6px 6px 2px 2px;background:var(--card2);min-height:3px}
.trend p.two i{width:38%}.trend p.two i.a{background:var(--card2)!important}.trend p.two i.b{background:var(--c)}
.trend .bl{position:absolute;left:-5px;right:-5px;border-top:2px dashed var(--red);opacity:.75}
.trend .cur i.a{background:color-mix(in srgb,var(--ink) 25%,transparent)!important}
.pbar{height:10px;border-radius:5px;background:var(--card2);overflow:hidden;margin:8px 0}.pbar i{display:block;height:100%;background:var(--c);border-radius:5px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;padding:14px}.kv span{display:block;font-size:13px;color:var(--mute)}.kv b{font-size:19px}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding:0 2px 10px;margin-bottom:2px}.hscroll button{flex:none}
.box{padding:14px}.box .lbl b{color:var(--ink)}
.trend .cur p:not(.two) i{background:var(--c)}.trend .cur{color:var(--ink);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:9px 14px;border-bottom:1px solid var(--line);text-align:start}
td.r,th.r{text-align:end}th{font-size:13px;color:var(--mute);font-weight:500}
tfoot td{font-weight:700;border-bottom:0}
nav{position:fixed;inset:auto 0 0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom)}
nav button{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mute)}
nav button svg{width:22px;height:22px}nav button.on{color:var(--p);font-weight:700}
#ov{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
#ov.show{display:flex}
#sh{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (prefers-reduced-motion:reduce){#sh{animation:none}}
.sht{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sht b{font-size:18px}
.amtin{width:100%;font-size:40px;font-weight:900;border:0;border-bottom:2px solid var(--c,var(--p));background:transparent;padding:4px 0;margin:4px 0 14px;outline:none;font-variant-numeric:tabular-nums}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-bottom:14px}
.cats button{min-height:42px;border-radius:12px;background:var(--card);font-size:14px;border:1.5px solid transparent;padding:0 4px}
.cats button.on{border-color:var(--c,var(--p));color:var(--c,var(--p));font-weight:700}
.fld{display:grid;grid-template-columns:5.5em minmax(0,1fr);align-items:center;gap:8px;margin-bottom:10px;font-size:15px;color:var(--mute)}
.fld input,.fld select{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:16px;width:100%}
.save{width:100%;min-height:52px;border-radius:14px;background:var(--c,var(--p));color:#fff;font-size:17px;font-weight:700;margin-top:6px}
.del{width:100%;min-height:46px;border-radius:14px;color:var(--red);margin-top:8px;font-weight:500}
.del.arm{background:var(--red);color:#fff}
.hint{font-size:13px;color:var(--mute);margin:-4px 0 12px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 58px);transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:14px;display:none;align-items:center;gap:12px;max-width:92vw}
#toast.show{display:flex}#toast button{color:var(--p);font-weight:700;min-height:32px}
textarea{width:100%;min-height:200px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:10px;font-size:14px}
.crow{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}.crow:last-child{border-bottom:0}
.crow input{flex:1;min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px;font-size:16px}
.crow input.cg{flex:none;width:3em;text-align:center;font-weight:900;font-size:18px;padding:0}
.crow button{flex:none;width:40px;height:42px;border-radius:10px;background:var(--card2);font-size:16px}.crow button:disabled{opacity:.3}
.crow button.x{color:var(--red)}.crow .sbtn{width:auto}
.sign{text-align:center;font-size:13px;color:var(--mute);margin-top:18px}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
:root{--car:#ff4a1c}
/* 車輛模式：競速儀表風——更深的底、朱紅、窄體數字、標題下的賽道條紋 */
body.race{--bg:light-dark(#f4f3f0,#0b0b0c);--card:light-dark(#fff,#18181a);--card2:light-dark(#eceae5,#242427);--line:light-dark(#e1dfda,#2c2c30)}
body.race .num,body.race .big,body.race .qamt b,body.race .qsm b,body.race .keys button,body.race .tiles b,body.race .tile b,body.race .amt,body.race .qtoday b{font-family:"Sofia Sans Condensed","Noto Sans TC",sans-serif;font-weight:800;letter-spacing:.01em}
body.race .qamt b{font-size:clamp(54px,16vw,76px)}body.race .keys button{font-size:30px}
body.race header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--car) 0 58%,transparent 58% 61%,var(--car) 61% 69%,transparent 69% 72%,var(--car) 72% 76%,transparent 76%)}
body.race header h1{font-style:italic}
body.race .tag{font-style:italic;font-family:"Sofia Sans Condensed","Noto Sans TC",sans-serif;font-weight:800;border-radius:3px;transform:skewX(-10deg)}
body.race .mseg button.on{background:var(--car);color:#fff}
body.race nav button.on{color:var(--car)}
body.race .tiles button{border-radius:8px}
body.race h3 button{color:var(--car)}
.qlink{color:var(--car);font-weight:700;min-height:36px;padding:0 6px}
.mseg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--card);border-radius:12px;padding:4px}
.mseg button{min-height:38px;border-radius:9px;font-size:15px;color:var(--mute)}.mseg button.on{background:var(--ink);color:var(--bg);font-weight:700}
.qf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.qsm{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding:2px;text-align:start;min-height:50px}
.qsm.on{border-color:var(--c)}.qsm span{font-size:13px;color:var(--mute);flex:none}.qsm b{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.qsm b.z{color:var(--mute);font-weight:400;opacity:.6}
.qamt.off{border-color:var(--line)}
.vchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.vchips button{flex:none;min-height:38px;padding:0 14px;border-radius:99px;background:var(--card);font-size:15px;border:1.5px solid transparent}.vchips button.on{border-color:var(--c);color:var(--c);font-weight:700}
.odo{display:flex;gap:4px;align-items:flex-end;margin:8px 0 4px}.odo span{background:#111;color:#f4f1ea;border-radius:7px;padding:4px 6px;font-size:clamp(30px,9vw,46px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}.odo span.u{background:var(--car);color:#fff}.odo em{font-style:normal;color:var(--mute);font-size:15px;margin-inline-start:4px}
svg.spark{width:100%;height:80px;display:block}
</style>
</head>
<body>
<header><h1>日帳</h1><span id="sync"><i></i><span>存在本機</span></span><button class="ib" data-a="settings" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></header>
<main id="main"></main>
<nav>
<button data-a="go" data-v="quick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></svg>記帳</button>
<button data-a="go" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>總覽</button>
<button data-a="go" data-v="car"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 16V11l2-5h10l2 5v5"/><path d="M3 16h18v3H3z"/><circle cx="7.5" cy="13.5" r="1"/><circle cx="16.5" cy="13.5" r="1"/></svg>車輛</button>
<button data-a="go" data-v="adv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>代墊</button>
<button data-a="go" data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>分析</button>
<button data-a="go" data-v="rec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg>定期</button>
</nav>
<div id="ov"><div id="sh"></div></div>
<div id="toast"><span></span><button></button></div>
<script>
{
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const addM=(ym,k)=>{let[y,m]=ym.split('-').map(Number);m+=k;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'-'+pad(m)};
const dim=(y,m)=>new Date(y,m,0).getDate();
const dueOf=(ym,day)=>{const[y,m]=ym.split('-').map(Number);return ym+'-'+pad(Math.min(day,dim(y,m)))};
const mL=ym=>{const[y,m]=ym.split('-');return y+'年'+(+m)+'月'};
const md=s=>(+s.slice(5,7))+'/'+(+s.slice(8));
const fmt=n=>(n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString('en-US');
const fmtK=n=>n>=1e4?'$'+(n/1e3).toFixed(n>=1e5?0:1)+'k':fmt(n);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const $=s=>document.querySelector(s);

const BOOKS={personal:{n:'個人',c:'var(--p)'},inspect:{n:'驗屋代墊',c:'var(--i)'},farm:{n:'農場',c:'var(--f)'},invest:{n:'投資',c:'var(--v)'}};
let COS=['馨芙家','家昕','永昇'];
let PARTIES=['馨芙家','家昕','永昇','農場'];
let FARM8=['設施建材','灌溉與水管系統','苗種與育苗材料','土壤與肥培管理','病害防治與耗材','工具與輔助','交通與雜支','人員人事費用'];
let CATS={personal:{out:['餐飲','交通','購物','居家','水電瓦斯','電信網路','房租房貸','車貸','保險','醫療','娛樂','人情','其他'],in:['薪資','獎金','代墊收回','其他收入']},
inspect:{out:['油資','停車過路','耗材工具','餐費','其他']},
farm:{out:FARM8,in:['農產銷售','補助','其他收入']}};
const PAL=['#3d7bff','#ff7a59','#2fb67a','#f5b400','#a35cff','#ff4f8b','#18b4c9','#b07d52','#7d8bb0','#9bbf2a','#ff9f1c','#5f6b7a','#d16bd1'];
const ST={pending:['未請款','pend'],claimed:['已請款','clm'],repaid:['已收回','ok']};
const DEFCATS=JSON.parse(JSON.stringify(CATS)),DEFCOS=[...COS],DEFBN={personal:'個人',inspect:'驗屋代墊',farm:'農場',invest:'投資'};
const CKEYS=[['personal.out','個人・支出'],['personal.in','個人・收入'],['inspect.out','代墊・支出'],['farm.out','農場・支出'],['farm.in','農場・收入']];
let GLYC={};
function cfg(){const m=S.meta;if(!m.cfg){const cats={};CKEYS.forEach(([k])=>{const[b,t]=k.split('.');cats[k]=DEFCATS[b][t].map(n=>({n,g:GLY0[n]||n[0]}))});m.cfg={bookN:{...DEFBN},cos:[...DEFCOS],cats}}return m.cfg}
function applyCfg(){const c=cfg();for(const k in BOOKS)BOOKS[k].n=(c.bookN&&c.bookN[k])||DEFBN[k];
 COS=c.cos.length?c.cos:[...DEFCOS];PARTIES=[...COS,'農場'];GLYC={};
 CATS={personal:{},inspect:{},farm:{}};CKEYS.forEach(([k])=>{const[b,t]=k.split('.');const L=(c.cats[k]||[]);CATS[b][t]=L.map(x=>x.n);L.forEach(x=>GLYC[b+'|'+x.n]=x.g)});
 FARM8=CATS.farm.out;S.meta.inv=S.meta.inv||[];CATS.invest={out:S.meta.inv.map(h=>h.name)};CATS.invest.in=CATS.invest.out;S.meta.inv.forEach(h=>GLYC['invest|'+h.name]=h.g||h.name[0])}
const CYC={1:'每月',2:'每2個月',3:'每3個月',6:'每半年',12:'每年'};

/* ---------- state ---------- */
const KEY='rizhang_v1';
let S={meta:{u:0,rec:[],set:{co:'馨芙家',farmAdv:true}},months:{}};
try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.meta&&r.months)S=r}catch(e){}
S.meta.set=S.meta.set||{co:'馨芙家',farmAdv:true};S.meta.rec=S.meta.rec||[];
const saveLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const allTx=()=>Object.values(S.months).flatMap(m=>m.tx);
const touch=k=>{if(k==='meta')S.meta.u=Date.now();else S.months[k.slice(1)].u=Date.now();saveLocal();queue(k)};
const addTx=t=>{const k=t.date.slice(0,7);(S.months[k]=S.months[k]||{u:0,tx:[]}).tx.push(t);touch('m'+k)};
const rmTx=id=>{for(const[k,m]of Object.entries(S.months)){const i=m.tx.findIndex(t=>t.id===id);if(i>-1){const t=m.tx.splice(i,1)[0];touch('m'+k);return t}}};
const getTx=id=>allTx().find(t=>t.id===id);
const party=t=>t.book==='inspect'?t.co:(t.book==='farm'&&t.adv?'農場':null);

/* ---------- cloud sync (db) ---------- */
let DB=null,COL=null,DL=null,dirty=new Set(),busy=false,ft;
const setSync=(on,txt)=>{const e=$('#sync');e.classList.toggle('on',on);e.lastChild.textContent=txt};
function queue(k){if(!COL)return;dirty.add(k);clearTimeout(ft);ft=setTimeout(flush,700)}
async function flush(){if(busy||!COL)return;busy=true;setSync(true,'同步中…');
 while(dirty.size){const k=[...dirty][0];dirty.delete(k);const body=k==='meta'?S.meta:S.months[k.slice(1)];if(!body)continue;
  try{await COL.doc(k).set(JSON.parse(JSON.stringify(body)))}catch(e){
   if(e&&e.code==='unavailable'){dirty.add(k);await new Promise(r=>setTimeout(r,1500+Math.random()*1500))}
   else if(e&&e.code==='quota_exceeded'){toast('雲端空間已滿，資料暫存本機');break}
   else {setSync(false,'僅存本機');busy=false;return}}}
 busy=false;setSync(true,'雲端同步')}
if(window.claude&&typeof window.claude.use==='function'){(async()=>{try{
 DL=await window.claude.use('downloads');
 const[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
 if(!db||!user)return;const id=await user.id();if(!id)return;
 DB=db;const col=db.collection('data/users/'+id);let first=true;
 const timer=setTimeout(()=>setSync(false,'雲端連線中…'),10000);
 col.onSnapshot(snap=>{let ch=false;const remote={};
  snap.docs.forEach(d=>{const v=JSON.parse(JSON.stringify(d.data()||{}));remote[d.id]=v;
   if(d.id==='meta'){if((v.u||0)>(S.meta.u||0)){S.meta=v;ch=true}}
   else if(d.id[0]==='m'){const k=d.id.slice(1),loc=S.months[k];if(!loc||(v.u||0)>(loc.u||0)){S.months[k]={u:v.u||0,tx:v.tx||[]};ch=true}}});
  if(first&&!snap.metadata.fromCache){first=false;clearTimeout(timer);COL=col;
   const keys=['meta',...Object.keys(S.months).map(k=>'m'+k)];
   keys.forEach(k=>{const loc=k==='meta'?S.meta:S.months[k.slice(1)];if(!remote[k]||(loc.u||0)>(remote[k].u||0))dirty.add(k)});
   dirty.size?flush():setSync(true,'雲端同步')}
  if(ch){S.meta.set=S.meta.set||{};S.meta.rec=S.meta.rec||[];saveLocal();render()}
 },()=>{clearTimeout(timer);setSync(false,'僅存本機')});
}catch(e){}})()}

/* ---------- recurring ---------- */
function recDates(r){let ym=r.start,prev=null,next=null;const t=today();
 for(let i=0;i<1200;i++){const d=dueOf(ym,r.day);if(d<=t){prev=d;ym=addM(ym,r.n)}else{next=d;break}}return{prev,next}}
function recStat(r,doneSet){const{prev,next}=recDates(r);const t=today();const done=d=>doneSet.has(r.id+'|'+d)||(r.skip||[]).includes(d);
 if(prev&&!done(prev))return{st:'over',due:prev,days:diff(t,prev)};
 if(next&&done(next))return{st:'done',due:next,days:diff(next,t)};
 if(!next)return{st:'ok',due:prev||'',days:0};
 const days=diff(next,t);return{st:days<=(r.rd??3)?'soon':'ok',due:next,days}}
const doneSet=()=>new Set(allTx().filter(t=>t.rec).map(t=>t.rec+'|'+t.per));
function recRow(r,ds_){const s=recStat(r,ds_);const b=BOOKS[r.book];
 const tag=s.st==='over'?`<span class="chip over">過期 ${s.days} 天未記</span>`:s.st==='soon'?`<span class="chip soon">${s.days===0?'今天':'還有 '+s.days+' 天'}</span>`:s.st==='done'?'<span class="chip ok">本期已記</span>':`<span class="chip">還有 ${s.days} 天</span>`;
 const btn=(s.st==='over'||s.st==='soon')?`<button class="sbtn pri" data-a="recpay" data-id="${r.id}" data-d="${s.due}">記一筆</button>`:'';
 return `<div class="row" style="--c:${b.c}"><span class="dot"></span><button class="grow" style="text-align:start" data-a="recedit" data-id="${r.id}"><b>${esc(r.name)} <span class="num" style="color:var(--mute);font-weight:400">${fmt(r.amt)}</span></b><small>${s.due?md(s.due):''} ${CYC[r.n]||''}・${b.n}${r.book==='inspect'?'・'+esc(r.co):''} ${tag}</small></button>${btn}${s.st==='over'?`<button class="sbtn" data-a="recskip" data-id="${r.id}" data-d="${s.due}">略過</button>`:''}</div>`}

/* ---------- view state ---------- */
const VIEWS=['quick','home','list','car','adv','stats','rec'];
let view=location.hash.slice(1)||'quick';if(!VIEWS.includes(view))view='quick';
let cur=today().slice(0,7),lf='all',q='',ap='馨芙家',sel=new Set(),sb='personal';

const sumOut=(m,f)=>(S.months[m]?.tx||[]).filter(t=>t.kind==='out'&&f(t)).reduce((a,t)=>a+ +t.amt,0);
const sumIn=(m,f)=>(S.months[m]?.tx||[]).filter(t=>t.kind==='in'&&f(t)).reduce((a,t)=>a+ +t.amt,0);
const bookLbl=t=>t.book==='personal'?'':'・'+(t.book==='inspect'?esc(t.co):t.book==='invest'?(t.kind==='in'?'贖回':'投資'):(t.adv?'農場代墊':'農場'));
function txRow(t){const b=BOOKS[t.book];const p=party(t);
 const st=p&&t.st?`<span class="chip ${ST[t.st][1]}">${ST[t.st][0]}</span>`:'';
 return `<button class="row" style="--c:${b.c}" data-a="edit" data-id="${t.id}"><span class="dot"></span><span class="grow"><b>${esc(t.note||t.cat)}</b><small>${md(t.date)}・${esc(t.cat)}${bookLbl(t)}${st}${t.inv?'<span class="chip ok">發票</span>':''}</small></span><span class="amt num ${t.kind==='in'?'in':''}">${t.kind==='in'?'+':''}${fmt(t.amt)}</span></button>`}

function vHome(){const m=today().slice(0,7),pm=addM(m,-1);
 const out=sumOut(m,t=>t.book==='personal'),inc=sumIn(m,t=>t.book==='personal'),last=sumOut(pm,t=>t.book==='personal');
 const d=out-last;
 const adv=allTx().filter(t=>party(t)&&t.st!=='repaid');const advSum=adv.reduce((a,t)=>a+ +t.amt,0);
 const oldest=adv.length?Math.max(...adv.map(t=>diff(today(),t.date))):0;
 const recs=S.meta.rec,dset=doneSet();const perMonth=recs.filter(r=>r.book==='personal').reduce((a,r)=>a+r.amt/r.n,0);
 const due=recs.map(r=>[r,recStat(r,dset)]).filter(([,s])=>s.st==='over'||s.st==='soon').sort((a,b)=>(a[1].due>b[1].due?1:-1));
 const nxt=recs.map(r=>recStat(r,dset)).filter(s=>s.st!=='over'&&s.due).sort((a,b)=>a.due>b.due?1:-1)[0];
 const recent=allTx().sort((a,b)=>(b.date+b.id)>(a.date+a.id)?1:-1).slice(0,6);
 return `<section class="hero"><div class="lbl">${mL(m)}・個人支出</div><div class="big num">${fmt(out)}</div>
 <div class="sub">收入 <span class="num">${fmt(inc)}</span>・結餘 <span class="num">${fmt(inc-out)}</span>${last?`・比上月<span class="${d>0?'up':'dn'}">${d>0?'多':'少'} <span class="num">${fmt(Math.abs(d))}</span></span>`:''}</div></section>
 ${(()=>{const bi=budgetInfo(m);return bi?`<div class="sub" style="margin-top:-4px">${bi.left>=0?`預算剩 <span class="num">${fmt(bi.left)}</span>・每天可花 <b class="num" style="color:var(--grn)">${fmt(bi.perDay)}</b>`:`<span class="up">本月已超出預算 <span class="num">${fmt(-bi.left)}</span></span>`}</div>`:''})()}
 <div class="books">${['personal','inspect','farm','invest'].map(k=>`<div class="bk" style="--c:${BOOKS[k].c}"><span>${esc(BOOKS[k].n)}</span><b class="num">${fmt(sumOut(m,t=>t.book===k))}</b></div>`).join('')}</div>
 <div class="duo"><button class="tile" data-a="go" data-v="adv"><span class="lbl">待收代墊</span><b class="num" style="color:var(--i)">${fmt(advSum)}</b><small>${adv.length?adv.length+' 筆・最久 '+oldest+' 天':'目前沒有欠款'}</small></button>
 <button class="tile" data-a="go" data-v="rec"><span class="lbl">定期花費</span><b class="num">${fmt(perMonth)}<span style="font-size:14px;font-weight:500">/月</span></b><small>${nxt?'下一筆 '+md(nxt.due):'尚未設定'}</small></button></div>
 <h3>需要處理的定期花費<button data-a="go" data-v="rec">全部</button></h3>
 <div class="card">${due.length?due.map(([r])=>recRow(r,dset)).join(''):`<div class="empty">${recs.length?'近期沒有到期的項目':'還沒有定期花費，到「定期」新增手機費、房租、車貸'}</div>`}</div>
 <h3>最近紀錄<button data-a="go" data-v="list">明細</button></h3>
 <div class="card">${recent.length?recent.map(txRow).join(''):'<div class="empty">按下方 ＋ 記第一筆</div>'}</div>`}

function mnav(){return `<div class="mnav"><button data-a="mm" data-k="-1" aria-label="上個月">‹</button><b>${mL(cur)}</b><button data-a="mm" data-k="1" aria-label="下個月">›</button></div>`}
function vList(){const F=[['all','全部','var(--ink)'],...Object.entries(BOOKS).map(([k,v])=>[k,esc(v.n),v.c])];
 let tx=(S.months[cur]?.tx||[]).filter(t=>lf==='all'||t.book===lf);
 if(q)tx=tx.filter(t=>(t.note+t.cat+(t.co||'')).includes(q));
 tx.sort((a,b)=>(b.date+b.id)>(a.date+a.id)?1:-1);
 const g={};tx.forEach(t=>(g[t.date]=g[t.date]||[]).push(t));
 const tot=tx.filter(t=>t.kind==='out').reduce((a,t)=>a+ +t.amt,0);
 return mnav()+`<div class="seg">${F.map(([k,n,c])=>`<button style="--c:${c}" class="${lf===k?'on':''}" data-a="lf" data-k="${k}">${n}</button>`).join('')}</div>
 <input class="search" id="q" placeholder="搜尋備註、分類、公司" value="${esc(q)}">
 <div class="lbl" style="margin:0 4px 8px">本月支出合計 <b class="num" style="color:var(--ink)">${fmt(tot)}</b>・${tx.length} 筆</div>
 <div class="card">${Object.keys(g).length?Object.entries(g).map(([d,a])=>`<div class="dayh"><span>${md(d)} 週${'日一二三四五六'[parse(d).getDay()]}</span><span class="num">${fmt(a.filter(t=>t.kind==='out').reduce((s,t)=>s+ +t.amt,0))}</span></div>`+a.map(txRow).join('')).join(''):'<div class="empty">這個月沒有紀錄</div>'}</div>`}

function vAdv(){const all=allTx().filter(t=>party(t));
 const PL=[...PARTIES,...new Set(all.filter(t=>t.st!=='repaid'&&!PARTIES.includes(party(t))).map(party))];if(!PL.includes(ap))ap=PL[0];
 const cards=PL.map(p=>{const a=all.filter(t=>party(t)===p&&t.st!=='repaid');const c=p==='農場'?BOOKS.farm.c:BOOKS.inspect.c;
  return `<button class="pt ${ap===p?'on':''}" style="--c:${c}" data-a="ap" data-k="${p}"><span>${p}</span><b class="num">${fmt(a.reduce((s,t)=>s+ +t.amt,0))}</b><small>未請 ${a.filter(t=>t.st==='pending').length}・已請 ${a.filter(t=>t.st==='claimed').length}</small></button>`}).join('');
 const open=all.filter(t=>party(t)===ap&&t.st!=='repaid').sort((a,b)=>a.date>b.date?1:-1);
 const done=all.filter(t=>party(t)===ap&&t.st==='repaid').sort((a,b)=>a.date<b.date?1:-1).slice(0,30);
 const selSum=open.filter(t=>sel.has(t.id)).reduce((s,t)=>s+ +t.amt,0);
 const total=all.filter(t=>t.st!=='repaid').reduce((s,t)=>s+ +t.amt,0);
 return `<section class="hero"><div class="lbl">外面總共欠我</div><div class="big num" style="color:var(--i)">${fmt(total)}</div><div class="sub">代墊不算個人支出；收回後勾「已收回」即可</div></section>
 <div class="party">${cards}</div>
 <h3>${ap}・未結清 ${open.length} 筆</h3>
 <div class="card">${open.length?`<div class="bar"><button class="sbtn" data-a="selall">${sel.size===open.length?'取消全選':'全選'}</button><span class="lbl grow">已選 ${sel.size} 筆 <b class="num" style="color:var(--ink)">${fmt(selSum)}</b></span></div>
 <div class="bar"><button class="sbtn" data-a="mark" data-k="claimed">標記已請款</button><button class="sbtn pri" data-a="mark" data-k="repaid">標記已收回</button><button class="sbtn" data-a="claimtxt">複製請款明細</button></div>`+
 open.map(t=>`<label class="row"><input type="checkbox" class="ck" data-sel="${t.id}" ${sel.has(t.id)?'checked':''}><span class="grow"><b>${esc(t.note||t.cat)}</b><small>${md(t.date)}・${esc(t.cat)}・${diff(today(),t.date)} 天前<span class="chip ${ST[t.st][1]}">${ST[t.st][0]}</span></small></span><span class="amt num">${fmt(t.amt)}</span></label>`).join(''):'<div class="empty">沒有未結清的代墊款</div>'}</div>
 ${done.length?`<details><summary style="margin:18px 4px 8px;color:var(--mute);font-size:15px;min-height:36px">已收回紀錄（${done.length}）</summary><div class="card">${done.map(txRow).join('')}</div></details>`:''}`}

function donut(items,total){const C=2*Math.PI*48;let off=0;
 const segs=items.map(([,v],i)=>{const L=v/total*C;const s=`<circle cx="60" cy="60" r="48" fill="none" stroke="${PAL[i%PAL.length]}" stroke-width="16" stroke-dasharray="${Math.max(L-1,0.01)} ${C}" stroke-dashoffset="${-off}"/>`;off+=L;return s}).join('');
 return `<div class="donut"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="48" fill="none" stroke="var(--card2)" stroke-width="16"/>${total?segs:''}</svg><div><b class="num">${fmtK(total)}</b><small>${items.length} 個分類</small></div></div>`}
let sc='';
function budgetInfo(m){const bd=cfg().budget||{};const B=+bd.total||0;if(!B)return null;
 const spent=sumOut(m,t=>t.book==='personal');const isCur=m===today().slice(0,7);let fixed=0;
 if(isCur){const dset=doneSet();S.meta.rec.filter(r=>r.book==='personal').forEach(r=>{const{prev,next}=recDates(r);[prev,next].forEach(d=>{if(d&&d.slice(0,7)===m&&!dset.has(r.id+'|'+d)&&!(r.skip||[]).includes(d))fixed+=r.amt})})}

  if(a===v.net)sc=0;else if(a===v.gross)sc=.5;else if(fuel&&t.vt==='fuel'&&(Math.abs(a-v.gross)<=2||Math.abs(a-v.net)<=2))sc=2;else return;
  sc+=dd*3+((t.vt==='fuel')!==fuel?1.5:0);pairs.push([sc,i,t])})});
 pairs.sort((a,b)=>a[0]-b[0]);const vi=new Set(),ti=new Set(),m=[];
 for(const[sc,i,t]of pairs){if(vi.has(i)||ti.has(t.id))continue;vi.add(i);ti.add(t.id);m.push({v:list[i],t,fix:Math.round(+t.amt)!==list[i].net})}
 const missing=list.filter((_,i)=>!vi.has(i)).map(v=>{let dup=null,best=99;const isF=isFuelInv(v);pool.forEach(t=>{if(ti.has(t.id))return;const a=Math.round(+t.amt);if(!(a>0))return;
   if(t.vt==='fuel'&&!isF)return;if(isF&&t.vt==='maint')return;const dd=Math.abs(diff(t.date,v.date));if(dd>7)return;
   const exact=a===v.net||a===v.gross,near=!exact&&v.net>=100&&Math.abs(a-v.net)<=v.net*.03;if(!exact&&!near)return;if(v.net<30&&dd>1)return;
   const sc=dd+(exact?0:2);if(sc<best){best=sc;dup=t}});
  if(dup)ti.add(dup.id);return{v,g:eGuess(v),dup}}).sort((a,b)=>a.v.date<b.v.date?1:-1);
 return{matched:m.sort((a,b)=>a.v.date<b.v.date?1:-1),missing}}

 const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=()=>res();s.onerror=()=>rej(new Error('無法連到 Google，請確認網路'));document.head.appendChild(s)})}
async function gToken(){if(gTok&&Date.now()<gExp)return gTok;await loadGis();const cid=gcid();if(!cid)throw new Error('尚未設定 Client ID');
 return new Promise((res,rej)=>{const c=google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/drive.file',
  callback:r=>{if(r.error)return rej(new Error('授權失敗：'+r.error));gTok=r.access_token;gExp=Date.now()+((r.expires_in||3600)-60)*1000;res(gTok)},
  error_callback:e=>rej(new Error(e&&e.type==='popup_closed'?'已取消登入':'無法開啟 Google 登入視窗'))});c.requestAccessToken({prompt:''})})}
async function gfetch(url,opt={}){const t=await gToken();const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({},opt.headers||{},{Authorization:'Bearer '+t})}));
 if(r.status===401){gTok=null;throw new Error('授權過期，請再按一次')}if(!r.ok)throw new Error('雲端硬碟回應錯誤（'+r.status+'）');return r}
const DAPI='https://www.googleapis.com/drive/v3/files';
async function gFolder(){let id=ls(GF);if(id)return id;
 const q=encodeURIComponent("name='日帳備份' and mimeType='application/vnd.google-apps.folder' and trashed=false");
 const j=await(await gfetch(`${DAPI}?q=${q}&fields=files(id)`)).json();id=j.files&&j.files[0]&&j.files[0].id;
 if(!id)id=(await(await gfetch(DAPI,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'日帳備份',mimeType:'application/vnd.google-apps.folder'})})).json()).id;
 ls(GF,id);return id}
async function gBackup(){toast('備份中…');try{const fid=await gFolder();const name=bakName('json'),body=JSON.stringify(S);
 const q=encodeURIComponent(`name='${name}' and '${fid}' in parents and trashed=false`);
 const ex=((await(await gfetch(`${DAPI}?q=${q}&fields=files(id)`)).json()).files||[])[0];
 if(ex)await gfetch(`https://www.googleapis.com/upload/drive/v3/files/${ex.id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});
 else{const fd=new FormData();fd.append('metadata',new Blob([JSON.stringify({name,parents:[fid],mimeType:'application/json'})],{type:'application/json'}));fd.append('file',new Blob([body],{type:'application/json'}));
  await gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',body:fd})}
 markBak();if($('#ov').classList.contains('show'))settings();else render();toast('已備份到 Google 雲端硬碟')}
 catch(e){if(/404/.test(e.message))ls(GF,null);toast(e.message||'備份失敗')}}

 const j=await(await gfetch(`${DAPI}?q=${encodeURIComponent(`'${fid}' in parents and trashed=false`)}&orderBy=name desc&pageSize=30&fields=files(id,name,size)`)).json();

 <div class="hint">選一份備份，確認後會覆蓋這台手機上的資料。</div>
 <div class="card">${L.length?L.map(f=>`<button class="row" data-a="gdget" data-id="${f.id}"><span class="grow"><b>${esc(f.name)}</b><small>${f.size?Math.ceil(f.size/1024)+' KB':''}</small></span><span>›</span></button>`).join(''):'<div class="empty">雲端硬碟裡還沒有備份</div>'}</div><div id="impok"></div>`);

 if(t.dataset.fp){const v=parseFloat(t.value);if(v>0){FP()[t.dataset.fp]=v;touch('meta');toast('油價已更新')}else t.value=FP()[t.dataset.fp]}
